<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야행 — 탄막 로그라이크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0919; --panel:#14122b; --ink:#ece9ff; --dim:#9591c0; --amber:#ffcf6e; --pink:#ff5fa2; --cyan:#5ff0ff; --line:#2b2752;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; overflow:hidden; }
#app{ height:100%; display:flex; align-items:center; justify-content:center; gap:24px; padding:8px; }
#wrap{ position:relative; flex:none; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#000; }
canvas{ display:block; width:100%; height:100%; touch-action:none; }

#overlay{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,7,20,.82); padding:6%; }
#overlay.show{ display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch; overflow-y:auto; }   /* 내용이 넘치면 잘리지 않고 스크롤 */
.box{ width:100%; text-align:center; margin:auto 0; }
h1,h2{ font-family:"Black Han Sans","Noto Sans KR",sans-serif; font-weight:400; margin:0; color:var(--amber); }
h1{ font-size:5.4em; letter-spacing:.1em; text-shadow:0 0 .45em rgba(255,207,110,.45); line-height:1.1; }
h2{ font-size:2.1em; }
.sub{ color:var(--cyan); margin:.4em 0 1.1em; }
.desc{ color:var(--dim); line-height:1.75; font-size:.9em; margin:0 0 1.6em; }
.btn{ font:inherit; font-weight:700; font-size:1.05em; background:var(--amber); color:#1a1230; border:0; border-radius:.6em; padding:.8em 1.9em; cursor:pointer; }
.btn:hover{ filter:brightness(1.08); }
.btn:focus-visible,.card:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.hint{ color:var(--dim); font-size:.78em; line-height:1.8; margin:1.6em 0 0; }
.stat{ line-height:1.9; margin:.2em 0 .6em; }
.chips{ display:flex; flex-wrap:wrap; gap:.4em; justify-content:center; margin:.6em 0 1.2em; }
.chip{ border:1px solid var(--line); border-radius:99px; padding:.2em .75em; font-size:.78em; }
.cards{ display:grid; gap:.7em; margin-top:1.1em; }
.card{ position:relative; text-align:left; font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:.7em; padding:.85em 1em .85em 2.7em; cursor:pointer; display:flex; flex-direction:column; gap:.2em; }
.card:hover{ border-color:var(--amber); }
.card.risk{ border-color:#7a2f5c; }
.card .key{ position:absolute; left:.95em; top:.85em; color:var(--dim); font-size:.9em; }
.card b{ font-size:1.05em; }
.card .d{ color:var(--dim); font-size:.85em; }
.card .lv{ color:var(--cyan); font-size:.76em; }
.card.risk .lv{ color:var(--pink); }
.card.rare{ border-color:var(--amber); background:#1e1a33; }
.box.compact h2{ font-size:1.9em; }
.box.compact .sub{ margin:.3em 0 .6em; }
.box.compact .btn.ghost{ margin-top:.8em; }
.cards.tight{ gap:.55em; margin-top:.8em; }
.card.char{ padding:.65em .9em .65em 2.3em; gap:.12em; }
.card.char .key{ top:.65em; left:.85em; }
.card.char .row{ display:flex; justify-content:space-between; align-items:baseline; gap:.6em; }
.card.char .d{ font-size:.82em; line-height:1.35; }
.card.char .d em{ font-style:normal; color:var(--cc); font-weight:700; margin-right:.55em; }
.card.char .lv{ color:var(--dim); font-size:.74em; white-space:nowrap; }
.card.char.collapsed{ flex-direction:row; align-items:baseline; justify-content:space-between; gap:.6em; padding:.5em .9em .5em 2.3em; opacity:.8; }
.card.char.collapsed .key{ top:.5em; }
.card.char.collapsed:hover{ opacity:1; }
.card.char.picked{ cursor:default; border-color:var(--cc); box-shadow:inset 0 0 0 1px var(--cc); }
.card.char.picked:hover{ border-color:var(--cc); }
.gim{ list-style:none; margin:.55em 0 0; padding:0; font-size:.82em; line-height:1.4; color:var(--ink); }
.gim li{ position:relative; padding-left:1.1em; margin:.22em 0; }
.gim li::before{ content:'◆'; position:absolute; left:0; top:.2em; font-size:.7em; color:var(--cc); }
.gim b{ color:var(--cc); }
.actions{ display:flex; gap:.6em; justify-content:center; align-items:center; margin-top:.9em; }
.actions .btn.ghost{ margin-top:0; }
.card.rare .lv{ color:var(--amber); }
.card.char{ border-left:4px solid var(--cc); }
.card.char .key{ color:var(--cc); }
.card.char b small{ color:var(--dim); font-weight:400; font-size:.8em; margin-left:.4em; }
.btn.ghost{ background:transparent; color:var(--dim); border:1px solid var(--line); margin-top:1em; padding:.55em 1.4em; font-size:.9em; }

#side{ width:230px; display:flex; flex-direction:column; gap:18px; max-height:100%; overflow:auto; }
#side h3{ margin:0 0 .45em; font-size:.95rem; color:var(--amber); font-weight:700; }
#side p{ margin:0; color:var(--dim); font-size:.82rem; line-height:1.85; }
#side ul{ list-style:none; padding:0; margin:0; font-size:.84rem; line-height:1.6; }
#side li{ margin-bottom:.5em; }
#side li small{ display:block; color:var(--dim); font-size:.76rem; }
#side .empty{ color:var(--dim); font-size:.82rem; }
@media (max-width:860px){ #side{ display:none; } }

#bombBtn{ position:absolute; right:4%; bottom:3%; width:4.4em; height:4.4em; border-radius:50%; border:2px solid var(--cyan);
  background:rgba(95,240,255,.14); color:var(--cyan); font:inherit; font-weight:700; display:none; visibility:hidden; touch-action:manipulation; }
#chargeBtn{ position:absolute; left:4%; bottom:3%; width:4.4em; height:4.4em; border-radius:50%; border:2px solid var(--amber);
  background:rgba(255,207,110,.14); color:var(--amber); font:inherit; font-weight:700; display:none; visibility:hidden; touch-action:manipulation; }
#linkBtn{ position:absolute; left:50%; bottom:3%; transform:translateX(-50%); width:4.4em; height:4.4em; border-radius:50%; border:2px solid #ff5fa2;
  background:rgba(255,95,162,.16); color:#ff9ac4; font:inherit; font-weight:700; display:none; visibility:hidden; touch-action:manipulation; }
@media (pointer:coarse){ #bombBtn, #chargeBtn, #linkBtn{ display:block; } }
</style>
</head>
